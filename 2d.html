<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Песочница (WebCraft)</title>
    <style>
        :root {
            --ui-bg: rgba(30, 30, 30, 0.85);
            --slot-bg: rgba(60, 60, 60, 0.8);
            --slot-border: #888;
            --slot-active: #fff;
            --text-color: #eee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Sharp pixels */
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            pointer-events: auto;
        }

        .controls-guide {
            background: var(--ui-bg);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            border: 2px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .controls-guide h3 { margin-bottom: 5px; color: #a4c2f4; }
        .controls-guide p { margin-bottom: 3px; }
        kbd { background: #444; padding: 2px 5px; border-radius: 4px; font-family: monospace; }

        .actions-menu {
            background: var(--ui-bg);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button.btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button.btn:hover { background: #45a049; }
        button.btn-danger { background: #f44336; }
        button.btn-danger:hover { background: #da190b; }

        .hotbar-container {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        .hotbar {
            background: var(--ui-bg);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            border: 3px solid #444;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }

        .slot {
            width: 48px;
            height: 48px;
            background: var(--slot-bg);
            border: 2px solid var(--slot-border);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .slot:hover { transform: scale(1.05); }
        .slot.active { border-color: var(--slot-active); box-shadow: 0 0 10px var(--slot-active); }
        
        .slot-index {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 12px;
            color: #ccc;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        .block-preview {
            width: 24px;
            height: 24px;
            border: 1px solid #222;
        }
        
        /* Modal for saving/loading */
        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffeb3b;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="hud">
        <div class="top-bar">
            <div class="controls-guide">
                <h3>Управление</h3>
                <p><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> или стрелки — Движение</p>
                <p><kbd>Пробел</kbd> — Прыжок</p>
                <p><kbd>ЛКМ</kbd> — Разрушить блок (добыча)</p>
                <p><kbd>ПКМ</kbd> — Поставить блок</p>
                <p><kbd>1</kbd>-<kbd>7</kbd> — Выбор предмета</p>
            </div>
            
            <div class="actions-menu">
                <button class="btn" onclick="craftPlanks()">Скрафтить доски (из дерева)</button>
                <button class="btn" onclick="saveGame()">Сохранить игру</button>
                <button class="btn btn-danger" onclick="resetGame()">Сбросить мир</button>
            </div>
        </div>

        <div class="hotbar-container">
            <div class="hotbar" id="hotbar">
                <!-- Slots generated via JS -->
            </div>
        </div>
    </div>

    <div id="notification">Сохранено!</div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 32;
        const MAP_WIDTH = 200;
        const MAP_HEIGHT = 100;
        const GRAVITY = 0.4;
        const TERMINAL_VELOCITY = 12;
        const JUMP_FORCE = -8.5;
        const PLAYER_SPEED = 4.5;
        const REACH_DISTANCE = 5; // Blocks

        // Block Dictionary
        const BLOCKS = {
            0: { id: 0, name: 'Воздух', solid: false, render: null },
            1: { id: 1, name: 'Трава', solid: true, color: '#41980a', bottomColor: '#70543E' },
            2: { id: 2, name: 'Земля', solid: true, color: '#70543E' },
            3: { id: 3, name: 'Камень', solid: true, color: '#7D7D7D' },
            4: { id: 4, name: 'Бедрок', solid: true, color: '#333333' },
            5: { id: 5, name: 'Дерево', solid: true, color: '#5C4033', detail: '#4A332A' },
            6: { id: 6, name: 'Листва', solid: true, color: 'rgba(34, 139, 34, 0.8)' },
            7: { id: 7, name: 'Доски', solid: true, color: '#C19A6B', detail: '#A68053' }
        };

        // Render functions for specific blocks
        function drawBlock(ctx, id, x, y, size) {
            const b = BLOCKS[id];
            if (!b || !b.solid) return;

            ctx.fillStyle = b.color;
            ctx.fillRect(x, y, size, size);

            // Details
            if (id === 1) { // Grass
                ctx.fillStyle = b.bottomColor;
                ctx.fillRect(x, y + size * 0.25, size, size * 0.75);
            } else if (id === 5) { // Wood Log
                ctx.fillStyle = b.detail;
                ctx.fillRect(x + size*0.2, y, size*0.1, size);
                ctx.fillRect(x + size*0.7, y, size*0.1, size);
            } else if (id === 7) { // Planks
                ctx.fillStyle = b.detail;
                ctx.fillRect(x, y + size*0.3, size, size*0.1);
                ctx.fillRect(x, y + size*0.7, size, size*0.1);
                ctx.fillRect(x + size*0.4, y, size*0.1, size);
            }
            
            // Subtle border for definition
            if (id !== 6) { // Don't border leaves
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, size, size);
            }
        }

        let state = {
            map: [],
            player: {
                x: MAP_WIDTH * TILE_SIZE / 2,
                y: 0,
                vx: 0,
                vy: 0,
                w: 24,
                h: 48,
                grounded: false
            },
            inventory: {
                1: 0, // Grass
                2: 0, // Dirt
                3: 0, // Stone
                5: 0, // Wood
                6: 0, // Leaves
                7: 0  // Planks
            },
            activeSlot: 1 // IDs corresponding to inventory keys
        };

        // Allowed slots for hotbar
        const HOTBAR_SLOTS = [1, 2, 3, 5, 6, 7]; 

        let camera = { x: 0, y: 0 };
        let keys = {};
        let mouse = { x: 0, y: 0, worldX: 0, worldY: 0, leftDown: false, rightDown: false };
        let particles = [];

        // Simple seeded random to keep chunks consistent if we wanted to expand
        function noise(x) {
            return Math.sin(x * 0.1) * 5 + Math.sin(x * 0.03) * 10;
        }

        function generateWorld() {
            state.map = new Array(MAP_WIDTH).fill(0).map(() => new Array(MAP_HEIGHT).fill(0));
            let highestPoint = MAP_HEIGHT;

            for (let x = 0; x < MAP_WIDTH; x++) {
                // Base surface height
                let surfaceY = Math.floor(MAP_HEIGHT / 2 + noise(x));
                if (surfaceY < highestPoint) highestPoint = surfaceY;

                for (let y = 0; y < MAP_HEIGHT; y++) {
                    if (y === MAP_HEIGHT - 1) {
                        state.map[x][y] = 4; // Bedrock
                    } else if (y > surfaceY + 5) {
                        state.map[x][y] = 3; // Stone
                    } else if (y > surfaceY) {
                        state.map[x][y] = 2; // Dirt
                    } else if (y === surfaceY) {
                        state.map[x][y] = 1; // Grass
                    }
                }
            }

            // Decorate with Trees
            for (let x = 3; x < MAP_WIDTH - 3; x++) {
                let surfaceY = 0;
                for (let y = 0; y < MAP_HEIGHT; y++) {
                    if (state.map[x][y] !== 0) { surfaceY = y; break; }
                }

                if (state.map[x][surfaceY] === 1 && Math.random() < 0.1) {
                    // Generate Tree
                    let treeHeight = Math.floor(Math.random() * 3) + 4;
                    // Trunk
                    for (let h = 1; h <= treeHeight; h++) {
                        if (surfaceY - h >= 0) state.map[x][surfaceY - h] = 5;
                    }
                    // Leaves
                    for (let lx = -2; lx <= 2; lx++) {
                        for (let ly = -2; ly <= 1; ly++) {
                            if (Math.abs(lx) === 2 && Math.abs(ly) === 2) continue; // Round corners
                            let nx = x + lx;
                            let ny = surfaceY - treeHeight + ly;
                            if (nx >= 0 && nx < MAP_WIDTH && ny >= 0 && ny < MAP_HEIGHT) {
                                if (state.map[nx][ny] === 0) state.map[nx][ny] = 6;
                            }
                        }
                    }
                    x += 4; // Prevent overlapping trees
                }
            }

            // Spawn player slightly above the highest point
            state.player.y = (highestPoint - 4) * TILE_SIZE;
        }

        window.addEventListener('keydown', e => { 
            keys[e.code] = true;
            
            // Hotbar selection
            if(e.key >= '1' && e.key <= '6') {
                state.activeSlot = HOTBAR_SLOTS[parseInt(e.key) - 1];
                updateHotbarUI();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) mouse.leftDown = true;
            if (e.button === 2) mouse.rightDown = true;
            handleInteraction();
        });

        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) mouse.leftDown = false;
            if (e.button === 2) mouse.rightDown = false;
        });

        // Prevent context menu on right click
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function getBlock(x, y) {
            if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return 4; // Treat bounds as bedrock
            return state.map[x][y];
        }

        function isSolid(x, y) {
            const blockId = getBlock(x, y);
            return BLOCKS[blockId] ? BLOCKS[blockId].solid : false;
        }

        function checkCollision(px, py, pw, ph) {
            let leftTile = Math.floor(px / TILE_SIZE);
            let rightTile = Math.floor((px + pw - 0.1) / TILE_SIZE);
            let topTile = Math.floor(py / TILE_SIZE);
            let bottomTile = Math.floor((py + ph - 0.1) / TILE_SIZE);

            for (let x = leftTile; x <= rightTile; x++) {
                for (let y = topTile; y <= bottomTile; y++) {
                    if (isSolid(x, y)) return true;
                }
            }
            return false;
        }

        function updatePhysics() {
            let p = state.player;

            // Horizontal movement
            if (keys['KeyA'] || keys['ArrowLeft']) p.vx = -PLAYER_SPEED;
            else if (keys['KeyD'] || keys['ArrowRight']) p.vx = PLAYER_SPEED;
            else p.vx = 0;

            // Apply X
            p.x += p.vx;
            if (checkCollision(p.x, p.y, p.w, p.h)) {
                if (p.vx > 0) p.x = Math.floor((p.x + p.w) / TILE_SIZE) * TILE_SIZE - p.w;
                else if (p.vx < 0) p.x = Math.floor(p.x / TILE_SIZE + 1) * TILE_SIZE;
                p.vx = 0;
            }

            // Keep in bounds X
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > MAP_WIDTH * TILE_SIZE) p.x = MAP_WIDTH * TILE_SIZE - p.w;

            // Vertical movement (Gravity)
            p.vy += GRAVITY;
            if (p.vy > TERMINAL_VELOCITY) p.vy = TERMINAL_VELOCITY;

            // Jump
            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && p.grounded) {
                p.vy = JUMP_FORCE;
                p.grounded = false;
            }

            // Apply Y
            p.y += p.vy;
            p.grounded = false;
            
            if (checkCollision(p.x, p.y, p.w, p.h)) {
                if (p.vy > 0) { // Falling and hit ground
                    p.y = Math.floor((p.y + p.h) / TILE_SIZE) * TILE_SIZE - p.h;
                    p.grounded = true;
                } else if (p.vy < 0) { // Jumping and hit ceiling
                    p.y = Math.floor(p.y / TILE_SIZE + 1) * TILE_SIZE;
                }
                p.vy = 0;
            }
            
            // Keep in bounds Y
            if (p.y > MAP_HEIGHT * TILE_SIZE) {
                p.y = 0; // Teleport up if fell out (shouldn't happen with bedrock)
                p.vy = 0;
            }
        }

        function spawnParticles(x, y, color) {
            for(let i = 0; i < 8; i++) {
                particles.push({
                    x: x + Math.random() * TILE_SIZE,
                    y: y + Math.random() * TILE_SIZE,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 1) * 4,
                    life: 1.0,
                    color: color
                });
            }
        }

        function handleInteraction() {
            // Calculate world coords based on mouse and camera
            mouse.worldX = mouse.x + camera.x;
            mouse.worldY = mouse.y + camera.y;

            let bx = Math.floor(mouse.worldX / TILE_SIZE);
            let by = Math.floor(mouse.worldY / TILE_SIZE);

            if (bx < 0 || bx >= MAP_WIDTH || by < 0 || by >= MAP_HEIGHT) return;

            // Center of player
            let pxC = state.player.x + state.player.w / 2;
            let pyC = state.player.y + state.player.h / 2;
            // Center of block
            let bxC = bx * TILE_SIZE + TILE_SIZE / 2;
            let byC = by * TILE_SIZE + TILE_SIZE / 2;

            let dist = Math.sqrt((pxC - bxC)**2 + (pyC - byC)**2);
            
            if (dist > REACH_DISTANCE * TILE_SIZE) return;

            if (mouse.leftDown) { // Mine
                let blockId = state.map[bx][by];
                if (blockId !== 0 && blockId !== 4) { // Not air, not bedrock
                    // Add to inventory
                    if(state.inventory[blockId] !== undefined) {
                        state.inventory[blockId]++;
                        updateHotbarUI();
                    }
                    spawnParticles(bx * TILE_SIZE, by * TILE_SIZE, BLOCKS[blockId].color);
                    state.map[bx][by] = 0;
                }
            } else if (mouse.rightDown) { // Place
                if (state.map[bx][by] === 0) {
                    let activeId = state.activeSlot;
                    if (state.inventory[activeId] > 0) {
                        // Ensure we don't place block on player
                        let tempSolid = BLOCKS[activeId].solid;
                        if (tempSolid) {
                            // Check overlap with player
                            let blockRect = { x: bx*TILE_SIZE, y: by*TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                            let p = state.player;
                            if (p.x < blockRect.x + blockRect.w &&
                                p.x + p.w > blockRect.x &&
                                p.y < blockRect.y + blockRect.h &&
                                p.y + p.h > blockRect.y) {
                                return; // Overlaps, cancel placement
                            }
                        }
                        
                        state.map[bx][by] = activeId;
                        state.inventory[activeId]--;
                        updateHotbarUI();
                    }
                }
            }
        }

        function craftPlanks() {
            if (state.inventory[5] >= 1) { // 1 Wood -> 4 Planks
                state.inventory[5] -= 1;
                state.inventory[7] += 4;
                updateHotbarUI();
                showNotification("Скрафчено 4 доски!");
            } else {
                showNotification("Недостаточно дерева!");
            }
        }

        function updateHotbarUI() {
            const container = document.getElementById('hotbar');
            container.innerHTML = '';
            
            HOTBAR_SLOTS.forEach((id, index) => {
                let slot = document.createElement('div');
                slot.className = `slot ${state.activeSlot === id ? 'active' : ''}`;
                slot.onclick = () => {
                    state.activeSlot = id;
                    updateHotbarUI();
                };

                let indexLabel = document.createElement('div');
                indexLabel.className = 'slot-index';
                indexLabel.innerText = index + 1;
                slot.appendChild(indexLabel);

                let preview = document.createElement('div');
                preview.className = 'block-preview';
                preview.style.backgroundColor = BLOCKS[id].color;
                slot.appendChild(preview);

                let count = document.createElement('div');
                count.className = 'slot-count';
                count.innerText = state.inventory[id] || 0;
                slot.appendChild(count);

                container.appendChild(slot);
            });
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.style.opacity = 1;
            setTimeout(() => { notif.style.opacity = 0; }, 2000);
        }

        function saveGame() {
            const data = JSON.stringify(state);
            localStorage.setItem('webcraft_save', data);
            showNotification("Мир сохранен!");
        }

        function loadGame() {
            const saved = localStorage.getItem('webcraft_save');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    // Handle missing inventory fields from older saves
                    if(!state.inventory[7]) state.inventory[7] = 0;
                    showNotification("Мир загружен!");
                    return true;
                } catch(e) {
                    console.error("Save corrupted", e);
                }
            }
            return false;
        }

        function resetGame() {
            if (confirm("Вы уверены, что хотите удалить этот мир и создать новый?")) {
                localStorage.removeItem('webcraft_save');
                location.reload();
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += GRAVITY * 0.5;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawPlayer() {
            let px = state.player.x - camera.x;
            let py = state.player.y - camera.y;

            // Head/Body
            ctx.fillStyle = '#E2A973'; // Skin
            ctx.fillRect(px + 4, py, 16, 16);
            
            // Shirt
            ctx.fillStyle = '#3b5998';
            ctx.fillRect(px, py + 16, 24, 20);
            
            // Pants
            ctx.fillStyle = '#1e3a5f';
            ctx.fillRect(px + 2, py + 36, 8, 12);
            ctx.fillRect(px + 14, py + 36, 8, 12);
        }

        function loop() {
            updatePhysics();
            updateParticles();

            // Camera follow
            camera.x = state.player.x - canvas.width / 2;
            camera.y = state.player.y - canvas.height / 2;

            // Clamp camera
            if (camera.x < 0) camera.x = 0;
            if (camera.y < 0) camera.y = 0;
            if (camera.x > MAP_WIDTH * TILE_SIZE - canvas.width) camera.x = MAP_WIDTH * TILE_SIZE - canvas.width;
            if (camera.y > MAP_HEIGHT * TILE_SIZE - canvas.height) camera.y = MAP_HEIGHT * TILE_SIZE - canvas.height;

            // Rendering
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate visible grid
            let startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
            let endCol = Math.min(MAP_WIDTH, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
            let startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
            let endRow = Math.min(MAP_HEIGHT, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

            // Draw World
            for (let x = startCol; x < endCol; x++) {
                for (let y = startRow; y < endRow; y++) {
                    let blockId = state.map[x][y];
                    if (blockId !== 0) {
                        drawBlock(ctx, blockId, Math.floor(x * TILE_SIZE - camera.x), Math.floor(y * TILE_SIZE - camera.y), TILE_SIZE);
                    }
                }
            }

            drawPlayer();

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x - camera.x, p.y - camera.y, 4, 4);
            });
            ctx.globalAlpha = 1.0;

            // Draw Highlight Cursor
            mouse.worldX = mouse.x + camera.x;
            mouse.worldY = mouse.y + camera.y;
            let hx = Math.floor(mouse.worldX / TILE_SIZE);
            let hy = Math.floor(mouse.worldY / TILE_SIZE);

            if (hx >= 0 && hx < MAP_WIDTH && hy >= 0 && hy < MAP_HEIGHT) {
                let dist = Math.sqrt((state.player.x + state.player.w/2 - (hx*TILE_SIZE+TILE_SIZE/2))**2 + 
                                     (state.player.y + state.player.h/2 - (hy*TILE_SIZE+TILE_SIZE/2))**2);
                if (dist <= REACH_DISTANCE * TILE_SIZE) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(Math.floor(hx * TILE_SIZE - camera.x), Math.floor(hy * TILE_SIZE - camera.y), TILE_SIZE, TILE_SIZE);
                }
            }

            requestAnimationFrame(loop);
        }

        function init() {
            resizeCanvas();
            if (!loadGame()) {
                generateWorld();
            }
            updateHotbarUI();
            requestAnimationFrame(loop);
        }

        // Start game
        window.onload = init;
    </script>
</body>
</html>
